function presentation(field,v){
  const maps=new Map(v.map.map(t=>[t.id,t])),units=[];
  const root=v.complete?v.tree:field.editor.candidateBuilder.top.root;
  const represented=new Set([...characters(root)].map(t=>t.id)),extras=new Map();
  const ranges=new Map(),depths=new Map();
  const visit=(n,depth=0)=>{const ms=[...characters(n)].map(t=>maps.get(t.id)).filter(Boolean);ranges.set(n.id,ms.length?[ms[0].start,ms.at(-1).end]:null);depths.set(n.id,depth);for(const p of n.parts)if(isNode(p))visit(p,depth+1);};visit(root);
  for(const t of v.entries.filter(t=>!represented.has(t.id))){
    const m=maps.get(t.id),draft=v.drafts.find(d=>d.root===t.id);
    let owner=ranges.has(draft?.presentationOwner)?draft.presentationOwner:root.id,best=-1;
    if(owner===root.id)for(const [id,r] of ranges)if(r&&r[0]<=m.start&&r[1]>=m.end&&depths.get(id)>best){owner=id;best=depths.get(id);}
    const list=extras.get(owner)||[];list.push(t);extras.set(owner,list);
  }
  const mapped=parts=>parts.flatMap(p=>isNode(p)?[...characters(p)]:isToken(p)?[p]:[]).map(t=>maps.get(t.id)).filter(Boolean);
  const attach=(dom,parts,kind='glyph',details={})=>{
    const ms=mapped(parts);if(!ms.length)return dom;
    const key=kind+':'+ms.map(m=>m.id).join(',');
    dom.setAttribute('data-unit',key);if(ms.some(m=>m.draft))dom.classList.add('is-draft');
    units.push({key,dom,kind,start:ms[0].start,end:ms.at(-1).end,...details});return dom;
  };
  const glyph=(parts,tag='mo',text=null)=>{
    const visible=parts.filter(t=>maps.has(t.id));if(!visible.length)return null;
    const n=math(tag);n.textContent=text??visible.map(t=>(tag==='mn'?module_units.superscript[t.char]:null)??({'*':'·','-':'−','⁻':'−','⁺':'+'}[t.char]||t.char)).join('');
    if(tag==='mi')n.setAttribute('mathvariant','normal');
    if(tag==='mo'&&/^[()\[\]{}]$/.test(n.textContent))n.setAttribute('symmetric','false');
    if(visible.every(t=>['decimal','separator'].includes(t.role))){n.setAttribute('lspace','0.08em');n.setAttribute('rspace','0.08em');}
    return attach(n,visible);
  };
  const content=(parts,tag)=>{
    const clusters=[];for(const t of parts.filter(t=>maps.has(t.id))){if(/^\p{M}$/u.test(t.char)&&clusters.length)clusters.at(-1).push(t);else clusters.push([t]);}
    return math('mrow',...clusters.map(ts=>glyph(ts,tag)));
  };
  const extent=p=>isNode(p)?ranges.get(p.id):isToken(p)&&maps.has(p.id)?[maps.get(p.id).start,maps.get(p.id).end]:null;
  const hole=(p,owner,position)=>{
    const anchor=v.map.find(m=>p.id?.split(':').includes(m.id));position=anchor?.end??position??v.caret;
    const n=math('mtext');n.textContent='□';n.classList.add('math-hole');
    const key='hole:'+p.id;n.setAttribute('data-unit',key);units.push({key,dom:n,kind:'hole',start:position,end:position,owner});return n;
  };
  const row=(parts,owner)=>math('mrow',...parts.map((p,i)=>{
    if(isNode(p))return node(p);
    if(p?.hole){const after=parts.slice(i+1).map(extent).find(Boolean),before=parts.slice(0,i).reverse().map(extent).find(Boolean);return hole(p,owner,after?.[0]??before?.[1]);}
    if(['spacing','quantity_separator'].includes(p.role)){const gap=math('mspace');gap.setAttribute('width','0.22em');return attach(gap,[p]);}
    return glyph([p],p.role==='digits'?'mn':['name','unit_name'].includes(p.role)||p.role?.startsWith('index:')?'mi':'mo');
  }));
  const child=(p,owner,position)=>p?.hole?hole(p,owner,position):node(p);
  const syntax=(dom,parts,kind,details)=>attach(dom,parts,kind,details);
  function node(n){const dom=renderNode(n);if(dom)dom.setAttribute('data-block',n.id);return dom;}
  function renderNode(n){
    let parts=n.parts;
    if(extras.has(n.id)){

    const children=parts.filter(p=>isNode(p)||p?.hole),tokens=role=>parts.filter(p=>isToken(p)&&p.role===role);
    switch(n.kind){
      case 'integer':return content(tokens('digits'),'mn');

        else if(isToken(visible.at(-1))&&visible.at(-1).role==='separator')out.append(hole({id:'index:'+visible.at(-1).id},n.id,maps.get(visible.at(-1).id)?.end));
        return out;
      }
      case 'binod':{
        const op=n.meta.operatorKey,operator=tokens('operator');
        if(children.length===2&&(op==='/'||op==='^')){
          let left=child(children[0],n.id,extent(children[0])?.[0]);const right=child(children[1],n.id,maps.get(operator[0]?.id)?.end);
          if(op==='^'&&(n.meta.derived||children[0]?.meta.derived)&&['binod','unod','quantity'].includes(children[0]?.kind)){const l=math('mo'),r=math('mo');l.textContent='(';r.textContent=')';left=math('mrow',l,left,r);}
          const out=math(op==='/'?'mfrac':'msup',left,right);
          return syntax(out,operator,op==='/'?'fraction':'join',{before:left,after:right});
        }
        if(n.meta.implicit&&children.length===2)return math('mrow',child(children[0],n.id),child(children[1],n.id));
        if(n.meta.derived&&children.length===2){const values=children.map(c=>{const dom=child(c,n.id);if(c.kind==='binod'&&(c.meta.priority||0)<(n.meta.priority||0)){const l=math('mo'),r=math('mo');l.textContent='(';r.textContent=')';return math('mrow',l,dom,r);}return dom;});return math('mrow',values[0],glyph(operator),values[1]);}
        return row(parts,n.id);
      }
      case 'relation':return math('mrow',child(children[0],n.id),glyph(tokens('comparison'),'mo',n.meta.comparison),child(children[1],n.id));
      case 'unod':{
        if(n.meta.position==='prefix'&&tokens('operator')[0]?.char==='√'){
          const body=child(children[0],n.id,maps.get(tokens('operator')[0].id)?.end),out=math('msqrt',body);return syntax(out,tokens('operator'),'prefix',{body});
        }
        return row(parts,n.id);
      }
      case 'function':{
        const name=children.find(p=>p.kind==='function_name'),list=children.find(p=>p.kind==='argument_list');
        const label=name?.parts.filter(isToken).map(t=>t.char).join(''),args=list?.parts.filter(p=>isNode(p)||p?.hole)||[];
        const open=list?.parts.filter(p=>isToken(p)&&p.role==='open')||[],close=list?.parts.filter(p=>isToken(p)&&p.role==='close')||[],sep=list?.parts.filter(p=>isToken(p)&&p.role==='separator')||[];
        if((label==='sqrt'&&args.length===1)||(label==='root'&&args.length===2)){
          const body=child(args[0],list.id,maps.get(open[0]?.id)?.end),degree=label==='root'?child(args[1]||{hole:true,id:'degree:'+n.id},list.id,maps.get(sep[0]?.id)?.end??extent(args[0])?.[1]):null;
          const out=math(degree?'mroot':'msqrt',body,...(degree?[degree]:[]));
          syntax(out,[...name.parts,...open],'prefix',{body});syntax(out,close,'close',{body,outer:out});if(degree)syntax(degree,sep,'join',{before:body,after:degree});return out;
        }

  }

  if(!v.text&&!field.showEmptyTree){const placeholder=math('mtext');placeholder.textContent='Введите выражение';placeholder.classList.add('placeholder');result.append(placeholder);}

}

// Степень корня поднимается ровно настолько, чтобы её нижний край (у дроби — вместе со знаменателем)
// не задевал «хвост» знака корня. Родная раскладка поднимает по базовой линии индекса, и у высокого индекса
// знаменатель оказывается на самом знаке. Внутренние корни обрабатываются раньше внешних.
function refreshMeasurementProjection(field,v){
  if(!field.measurementProjection){const p=el('div','measurement-projection');p.setAttribute('aria-label','Численное представление в СИ');p.hidden=true;field.restrictionsPanel?.append(p);field.measurementProjection=p;}
  const surface=field.measurementProjection,rows=field.physicsResult?.occurrences||field.physicsSession?.inspect(v.expressionTree,field.editor.registry.measurements)||[];
  if(!v.complete||rows.some(row=>row.kind==='existing-unit'&&row.ordinary)){
    surface.hidden=true;surface.replaceChildren();return;
  }
  const hasQuantity=[...module_0.walk(v.tree)].some(n=>n.kind==='quantity'),hasConstant=rows.some(r=>r.selection?.coefficient_value&&!r.ordinary);
  if(!hasQuantity&&!hasConstant){surface.hidden=true;surface.replaceChildren();return;}
  try{
    const result=module_registry_expansion.expand(v.tree,{representation:'blocks',measurements:field.editor.registry.measurements,physicsSession:field.physicsSession,rows,exactOnly:false}),tree=result.tree,entries=[...characters(tree)];let at=0;
    const map=entries.map(t=>{const start=at;at+=t.char.length;return {...t,start,end:at};});
    const projected=presentation(field,{...v,tree,entries,map,text:module_0.nodeText(tree),drafts:[],complete:true});
    const label=el('span','measurement-projection-label',result.exact?'СИ: ':'СИ ≈ '),formula=el('div','numeric-projection-formula');formula.append(label,projected.dom);
    surface.replaceChildren(formula);
    const values=result.expansions.filter(r=>['usage','constant'].includes(r.kind));
    if(values.length){
      const note=el('div','constant-provenance');note.textContent=[...new Set(values.map(r=>r.source?.edition).filter(Boolean))].join('; ');
      const uncertain=values.filter(r=>!r.exact);if(uncertain.length)note.textContent+='; приближённые значения, стандартная неопределённость: '+uncertain.map(r=>r.standard_uncertainty?r.standard_uncertainty.mantissa+'·10^'+r.standard_uncertainty.exponent:r.id).join('; ');
      surface.append(note);
    }
    surface.hidden=false;delete surface.dataset.error;
  }catch(error){surface.hidden=false;surface.dataset.error='true';surface.replaceChildren(el('span','constant-provenance','Раскрытие недоступно: '+error.message));}
}

// One semantic panel on the existing field; settings live in the bottom dock.
// Context is an action on one field; explicit symbol choices take precedence.
const inputContext=(()=>{
  const store=module_fis_data.store,status=el('span','input-context-status');
  status.setAttribute('role','status');restrictionsDock.append(status);
  const refresh=()=>{
    status.textContent=store.status==='loading'?'Загрузка справочников…':store.status==='stale'?'Обновление не удалось':store.status==='error'?'Справочники недоступны':'';
    status.hidden=!status.textContent;status.title=store.error||'';syncRestrictionsDock();
  };
  const apply=(session,domain='')=>session.setContext({domains:module_fis_data.contextDomains(domain)});
  // After a domain change, history must re-anchor initialPhysics to the same first
  // expression under the new context; otherwise dimensionalClasses compares the live
  // interpretation with a stale frozen one even when the math text is unchanged.
  const realignHistory=(field)=>{
    const session=field.transformationHistory;
    if(!session||session.pendingDeletion||!session.entries?.length)return;
    const first=session.entries[0]?.snapshot?.expressionTree;
    if(!first)return;
    const registry=field.editor.registry;
    const initialPhysics=module_fis_history.capture(first,{session:field.physicsSession,registry});
    const semantic=module_fis_history.project(first,initialPhysics.rows);
    const initialSemanticDomain=structuredClone(equivalence.physicalRestrictions(semantic.tree,registry,{quantityRows:initialPhysics.rows}));
    session.initialPhysics=initialPhysics;
    session.initialSemanticDomain=initialSemanticDomain;
    session.recordRevision=(session.recordRevision||0)+1;
  };
  const setDomain=(field,value,{reset=false}={})=>{
    field.physicsSession.resetSelections({includeExplicit:reset});apply(field.physicsSession,value||'');
    realignHistory(field);
    field.refreshPhysicsUI?.();refreshMeasurementProjection(field,field.editor.view());field.processTransformation?.({type:'CHECK_HISTORY'});field.refreshTransformationUI?.();field.schedule();syncRestrictionsDock();
  };
  const install=(field,title)=>{
    const panel=el('div','context-popover'),caption=el('label','context-label','Контекст для обозначений'),select=el('select');
    panel.hidden=true;panel.id='context-'+field.id;panel.setAttribute('role','group');panel.setAttribute('aria-label','Общий контекст '+field.id);select.id='input-physics-context-'+field.id;select.setAttribute('aria-label','Раздел физики для '+field.id);caption.append(select);title.setAttribute('aria-controls',panel.id);title.setAttribute('aria-expanded','false');
    panel.append(caption);field.restrictionsPanel.append(panel);
    const hide=()=>{panel.hidden=true;title.setAttribute('aria-expanded','false');syncRestrictionsDock();};
    // Only pure algebra and the ~10 root physics sections from domains.json.
    // Nested and mathematics paths stay out of the UI; the root filter already
    // drives symbol→quantity ranking.
    const fill=()=>{
      select.replaceChildren();
      const algebra=el('option','','Чистая алгебра');algebra.value='';select.append(algebra);
      const records=store.catalogue?.domainRecords||[];
      const roots=records.filter(d=>!d.path.includes('mathematics')&&(d.parent==null||d.id==='general'));
      for(const row of roots){
        const label=row.name?.[1]||row.name?.[0]||row.id;
        const option=el('option','',label);option.value=row.id;select.append(option);
      }
      const current=field.physicsSession?.context?.domains?.[0]||'';
      select.value=roots.some(r=>r.id===current)?current:'';
    };
    title.addEventListener('click',()=>{if(!panel.hidden){hide();return;}for(const f of fields)if(f!==field)f.closeContext?.();fill();activate(field);panel.hidden=false;title.setAttribute('aria-expanded','true');syncRestrictionsDock();select.focus({preventScroll:true});});
    select.addEventListener('change',()=>{setDomain(field,select.value);hide();title.focus({preventScroll:true});});
    panel.addEventListener('pointerdown',e=>e.stopPropagation());panel.addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Escape'){hide();title.focus({preventScroll:true});}});
    field.closeContext=hide;

  store.subscribe(refresh);refresh();return {apply,setDomain,install};
})();
const domainDisplay=(()=>{
  const toggle=el('button','domain-toggle');
  toggle.type='button';toggle.setAttribute('aria-label','Показать компоненты списком');toggle.title='Показать компоненты списком';toggle.setAttribute('aria-pressed','false');toggle.setAttribute('aria-controls','component-sections');
  restrictionSections.id='component-sections';restrictionsDock.dataset.domainView='row';
  toggle.innerHTML='<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h2m3 0h9M3 10h2m3 0h9M3 15h2m3 0h9" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>';
  restrictionsDock.append(toggle);
  const symbol=component=>component.symbol||component.label.split(' (')[0];
  const find=(components,item)=>components?.find(c=>c.label===item.dataset.componentLabel)||components?.find(c=>symbol(c)===item.dataset.physicsSymbol);
  const bound=value=>value===null?null:value.d==='1'?value.n:value.n+'/'+value.d;
  const siUnit=component=>{
    const record=component.quantityConstraints?.find(c=>c.coefficient_value&&Array.isArray(c.dimension));if(!record)return '';
    const numerator=[],denominator=[],catalogue=module_fis_data.store.catalogue;
    for(let i=0;i<record.dimension.length;i++){

## 3. Не реализовано

Намеренно исключённых требований текущего задания нет. Новый универсальный решатель произвольных связанных нелинейных систем не создавался: используются действующие Algebra, mathRuntime и механизм диапазонов. Неизвестные и выходящие за их пределы случаи не получают автоматического успешного вердикта.

## 4. Намеренные ограничения прототипа

- Сокращений текущего запроса нет; область и отсутствие полной нормативной спецификации EDIT объявлены до изменения кода.
- Реестр блоков: сохранены 19 из 19 типов исходной 48.1 (15 базовых и 4 добавочных). Наличие типа не подменяет проверку всех его ветвей.
- Публичные API сохранены; добавлена Matchin.expansion.scalar. INSERT, REPLACE, FOCUS, UNDO, REDO и нативный ввод участвовали в проверке. Полный перебор остальных событий не заявляется.
- Стандартная неопределённость u — зарегистрированное свидетельство точности, а не гарантированная граница истинного значения. Интервал v±u явно помечен; зависящие от него закрытые сравнения условны, точное равенство округлённому центру не удостоверяется.
- Канонический AST и исходная лента не изменяются ради численных подстановок. Нового парсера или решателя в исправлении нет; старый HTML остаётся самостоятельным приложением с единственными внешними обращениями к реестрам GitHub.
