азования в новой проекции исчерпывающе не проверены: NOT RUN |\n| Прочие ветви перенесённого ядра | Модули ввода перенесены из эталона без изменения законов | Исчерпывающий перебор всех неоднозначностей, AUTO, границ и вариантов CHOOSE: NOT RUN |\n| Источники ввода | Обработчики beforeinput, paste, cut, compositionend, input сохранены | Реальная IME, мобильная клавиатура, screen reader, другие браузеры: NOT RUN |\n| Каталог единиц | Встроены 32 единицы и таблица приставок из указанной ревизии | Автообновление удалённого реестра не выполняется; латинское m не подменяется кириллическим м |\n\n## 3. Не реализовано\n| Требование / возможность | Следствие для пользователя |\n|---|---|\n| Полная формальная верификация EDIT | Успех выполненных сценариев не доказывает полное соответствие концепту |\n| Семантический интерфейс Matchin: история преобразований, панели физических величин и областей | Сохранён запрошенный интерфейс Dotchin; перенесена логика ввода |\n\n## 4. Намеренные ограничения прототипа\n- Намеренного сокращения запроса не вводилось.\n- Реестр: 15 исходных типов и 6 дополнительных типов (quantity, measurement_draft, dimension, dimension_unit, dimension_absolute, dimension_affix), всего 21. Сохранены профили и ограничения эталона.\n- API событий: INSERT, REPLACE, DELETE, AUTO, FOCUS, CHOOSE, CANCEL_PENDING, UNDO, REDO. Диагностика window.dochin (getState, getTrace, getConversion) доступна только для чтения.\n- Снимок реестра встроен для автономной работы, версия зафиксирована явно. Это адаптация упаковки, а не новый словарь правил.\n- В отличие от старой сборки, буфер и замена при отказе применяют атомарную политику актуального ядра. Неоднозначные введённые символы могут оставаться черновиками в строке; отображается кандидат, подтверждённое дерево доступно в диагностике.\n- Реконструкция использует исходный событийный Assembler и кэш эталона. Новый строковый парсер, синтетические токены умножения и прямые обходные мутации из UI не добавлены. Формальная проверка всех архитектурных инвариантов: NOT RUN.\n\n## 5. Тесты\n| Тест / сценарий | Статус PASS/FAIL/NOT RUN/BLOCKED | Свидетельство / причина |\n|---|---|---|\n| Ядро: единицы, степени, произведения, функции, регрессии, отказы, черновик, ID, история | PASS | node work/verify.cjs; 25 PASS, 0 FAIL |\n| Chromium: ввод 9 выражений, редактирование степени, уход фокуса | PASS | node work/browser-verify.cjs; 11 PASS, 0 FAIL; ошибок страницы нет |\n| Структурное разделение и независимые правки | PASS | node work/affix-verify.cjs: 11 PASS; 6 записей, удаление и замена аффикса, удаление основы, восстановление, Undo/Redo |\n| Отдельные блоки и правки через поле | PASS | node work/affix-browser.cjs: 3 PASS; раздельное отображение, смена и удаление аффикса |\n| Структура и числовая конвертация, обратные ссылки | PASS | node work/conversion-verify.cjs: 11 PASS; степени 0, 2, −2, −12, внешняя степень величины; изменение приставки/степени и удаление приставки |\n| Браузерные связи исходного и производного ввода | PASS | node work/conversion-browser.cjs: 4 PASS; две копии, подсветка, выбор степени, выбор приставки |\n| Синтаксис извлечённых модулей | PASS | node --check work/core.js |\n| Двойной клик, весь набор вариантов CHOOSE, буфер ОС, реальная IME, мобильные устройства | NOT RUN | Отдельные сеансы не выполнялись |\n| Формальное полное покрытие нормативной спецификации | BLOCKED | Отдельная спецификация не предоставлена |\n\n## 6. Итог и следующий проверяемый шаг\n- Подтверждено: перечисленные сценарии актуальной логики в автономном интерфейсе Dotchin.\n- Не подтверждено: полное покрытие EDIT и все ветви исходного Matchin.\n- Известные дефекты в выполненном наборе: не обнаружены. Ограничения проверки указаны выше.\n- Следующий проверяемый шаг: открыть HTML локально и проверить свои выражения; для воспроизведения использовать window.dochin.getState() и getTrace().\n","test_logs":{"test-results":"PASS quantity 2м\nPASS quantity 2мм\nPASS quantity 2кг\nPASS quantity 2Н\nPASS quantity 2
